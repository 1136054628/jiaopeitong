<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0033A0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="教培通">
  <meta name="description" content="教培通 —— 教培行业手机工作台">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/icon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="stylesheet" href="styles.css">
  <title>教培通</title>
</head>
<body>
  <div id="app">
    <!-- 顶栏：LOGO -->
    <header class="topbar">
      <div class="topbar-brand" id="topbarBrand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
            <path d="M12 4 22 8 12 12 2 8Z" fill="#0033A0"/>
            <path d="M6 10.5v4.2c0 1.2 2.7 2.3 6 2.3s6-1.1 6-2.3v-4.2" stroke="#0033A0" stroke-width="1.4" fill="none" stroke-linecap="round"/>
            <path d="M22 8v5" stroke="#0033A0" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-name">教培通</span>
      </div>
      <button class="icon-btn" id="topbarAction" aria-label="操作" style="visibility:hidden">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <!-- 主内容 -->
    <main class="main" id="main"></main>

    <!-- 底部导航 -->
    <nav class="bottomnav" id="bottomNav"></nav>

    <!-- 弹窗与提示 -->
    <div id="modalRoot"></div>
    <div id="toastRoot"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
